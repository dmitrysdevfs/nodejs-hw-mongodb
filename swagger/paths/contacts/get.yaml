tags:
  - Contacts
summary: Retrieve a paginated list of contacts
operationId: getStudents
description: >
  Returns a paginated list of contacts belonging to the authenticated user.
  Supports filtering by contact type and favourite status, sorting by any contact field,
  and pagination via query parameters.

    This route requires a valid access token (bearerAuth).
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    description: Page number for pagination
    schema:
      type: integer
      example: 1
  - in: query
    name: perPage
    description: Number of contacts per page
    schema:
      type: integer
      example: 10
  - in: query
    name: sortBy
    schema:
      type: string
      example: 'name'
      description: Field name to sort by (e.g. name, contactType, etc). Default is `_id`
  - in: query
    name: sortOrder
    description: 'Sort direction: ascending (`asc`) or descending (`desc`)'
    schema:
      type: string
      enum: [asc, desc]
      example: 'asc'
  - in: query
    name: contactType
    description: Filter contacts by category
    schema:
      type: string
      enum: [work, home, personal]
      example: personal
  - in: query
    name: isFavourite
    description: Filter contacts by "favourite" status
    schema:
      type: boolean
      example: false
responses:
  '200':
    description: Successfully retrieved list of contacts
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasNextPage
                - hasPreviousPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: number
                  example: 2
                perPage:
                  type: number
                  example: 10
                totalItems:
                  type: number
                  example: 47
                totalPages:
                  type: number
                  example: 5
                hasNextPage:
                  type: boolean
                  example: true
                hasPreviousPage:
                  type: boolean
                  example: false
  '401':
    $ref: ../../components/responses/401.yaml

tags:
  - Contacts
summary: Retrieve a contact by ID
operationId: getContactById
description: >
  Returns a contact that matches the provided unique identifier (ID).
  The endpoint is secured and requires a valid access token (bearerAuth).
  If the contact does not exist or does not belong to the authenticated user,
  a `404 Not Found` response will be returned.

    You can use this endpoint to view full details of a contact,
    including name, email, phone number, and photo (if available).
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    description: Unique identifier of the contact (MongoDB ObjectId)
    schema:
      type: string
      example: 64f7e05a0c0e5568fda154c8
responses:
  '200':
    description: Successfully retrieved contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact with id 64f7e05a0c0e5568fda154c8
            data:
              type: object
              $ref: ../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../components/responses/401.yaml
  '404':
    $ref: ../../../components/responses/404.yaml
  '500':
    $ref: ../../../components/responses/500.yaml
